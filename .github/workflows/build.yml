name: Check and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check every article
        run: python3 tools/build.py --check

      - name: Unit tests
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      - name: Build all editions
        run: python3 tools/build.py

      - name: Upload editions
        uses: actions/upload-artifact@v7
        with:
          name: just-in-case-editions
          path: |
            dist/
            !dist/site/
          retention-days: 30

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn: [esp32:esp32:esp32, esp32:esp32:esp32c3, esp8266:esp8266:d1_mini]
    steps:
      - uses: actions/checkout@v7

      # Arduino CLI straight from its release, checked against the published checksum
      # (1.5.1-checksums.txt). Update the version and hash in all three workflows together.
      - name: Install Arduino CLI 1.5.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/arduino-cli.tar.gz" \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
          echo "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  $RUNNER_TEMP/arduino-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin"
          tar -xzf "$RUNNER_TEMP/arduino-cli.tar.gz" -C "$HOME/bin" arduino-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install board package
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install "$(echo '${{ matrix.fqbn }}' | cut -d: -f1-2)"

      - name: Compile
        run: arduino-cli compile --fqbn "${{ matrix.fqbn }}" --warnings all hardware/esp32/JustInCase
