# Publishes the website (dist/site/) to GitHub Pages on every push to main,
# including the offline web app and the one-click ESP32 installer at /flash/.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build
        run: python3 tools/build.py

      - name: Cache Arduino board packages
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.12

      # Arduino CLI straight from its release, checked against the published checksum
      # (1.5.1-checksums.txt). Update the version and hash in all three workflows together.
      - name: Install Arduino CLI 1.5.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/arduino-cli.tar.gz" \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
          echo "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  $RUNNER_TEMP/arduino-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin"
          tar -xzf "$RUNNER_TEMP/arduino-cli.tar.gz" -C "$HOME/bin" arduino-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install the ESP32 board package
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: One-click ESP32 installer
        run: python3 hardware/esp32/build_firmware.py dist/site/flash

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - id: deployment
        uses: actions/deploy-pages@v5
