; PlatformIO build for the library hotspot. Arduino IDE users can ignore this file.
;
;   cd hardware/esp32
;   pio run -e esp32 -t upload      # 1. firmware
;   pio run -e esp32 -t uploadfs    # 2. library files (run tools/build.py first)
;
; Pick the environment that matches your board: esp32, esp32-c3, esp32-s3, esp8266.

[platformio]
src_dir = JustInCase
data_dir = JustInCase/data
default_envs = esp32

[env]
; ESP32 boards use the "No OTA" partition layout: about 1.9 MB for the library.
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

[env:esp32]
platform = espressif32
board = esp32dev
board_build.partitions = no_ota.csv

[env:esp32-c3]
; Tiny "ESP32-C3 SuperMini" boards and ESP32-C3 DevKits.
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = no_ota.csv
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = no_ota.csv

[env:esp8266]
; Wemos/LOLIN D1 mini and other 4 MB ESP8266 boards: 2 MB for files.
platform = espressif8266
board = d1_mini
board_build.ldscript = eagle.flash.4m2m.ld
