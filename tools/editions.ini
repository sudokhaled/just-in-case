# Device editions: one section per file or folder the build makes.
#
# Every edition comes from the same articles, cut to fit a device.
#
#   devices    who it is for, shown on the "Which file for my device?" page
#   label      what the file is, shown as a download link on the website
#   format     html | site | epub | txt | ascii | mp3 | cards | book | pocket | esp
#   critical, important, useful
#              how much of each article to include, by priority:
#              full = the whole article, nano = only the warnings and quick
#              steps, omit = leave the article out
#   drawings   yes | no
#   offer      yes = the website offers this file for download
#   budget     size limit in KB: the file size, or for esp the flash it needs.
#              0 = no limit. The build fails if a file does not fit.
#   shrink     what to cut, in order, until it fits the budget:
#              drawings, useful:nano, important:nano, useful:omit,
#              important:omit, download:core, download:nano, download:none
#   pages      site and esp only: article (one page each) or category
#              (one page per topic: far fewer files for tiny file systems)
#   download   esp only: which single-file library visitors can save:
#              full, core, nano or none
#   dest       esp only: where to write the gzipped files
#
# Sections are built in order. "site" and "esp" sections must come after the
# files they offer for download. Translations get ".<lang>" before the
# extension (just-in-case.ar.html) and their own site folder.

[just-in-case.html]
devices = Laptop or desktop; phone or tablet (any browser, saved as one file)
label = Whole library as one web page (open it in any browser, offline)
format = html
critical = full
important = full
useful = full
drawings = yes
offer = yes
budget = 3500

[just-in-case.epub]
devices = Kindle (as AZW3 from the release); Kobo, PocketBook and other e-readers; phone book apps
label = E-book (EPUB) for e-readers and phone book apps
format = epub
critical = full
important = full
useful = full
drawings = yes
offer = yes

[just-in-case.txt]
devices = Anything that shows text (UTF-8)
label = Plain text, the whole library
format = txt
critical = full
important = full
useful = full
drawings = no
offer = yes

[just-in-case-core.txt]
devices = Tiny screens that need plain ASCII text: the critical articles in full
label = Core edition, plain ASCII text
format = ascii
critical = full
important = omit
useful = omit
drawings = no
offer = yes

[just-in-case-mp3.txt]
devices = MP3/MP4 players with a text reader; old phones; tiny screens (plus one small file per topic in the mp3 folder)
label = Short edition for MP3 players and tiny screens (ASCII)
format = mp3
critical = nano
important = nano
useful = nano
drawings = no
offer = yes
budget = 220

[just-in-case-core.html]
devices = Printing the critical articles from any browser
format = html
critical = full
important = omit
useful = omit
drawings = yes

[just-in-case-cards.html]
devices = Paper: 16 pocket cards to cut out and laminate
format = cards

[just-in-case-book.html]
devices = Paper: the whole library as an A4 book with page numbers and an index (make the PDF with weasyprint)
format = book
critical = full
important = full
useful = full
drawings = yes

[just-in-case-core-book.html]
devices = Paper: the critical articles as an A4 book
format = book
critical = full
important = omit
useful = omit
drawings = yes

[just-in-case-pocket.html]
devices = Paper: an A6 pocket booklet of every article's warnings and quick steps
format = pocket
critical = nano
important = nano
useful = nano
drawings = no

[site]
devices = Raspberry Pi hotspot; any web server; the website, installable as an offline app
format = site
critical = full
important = full
useful = full
drawings = yes
pages = article

[esp32]
devices = ESP32 boards with 4 MB flash (the browser installer uses this)
format = esp
critical = full
important = full
useful = full
drawings = yes
pages = article
download = full
dest = hardware/esp32/JustInCase/data
budget = 1720
shrink = download:core, drawings, useful:nano, important:nano

[esp-small]
devices = Small boards with about 0.5 MB of file space, such as an ESP8266 with 1 MB flash (ESP-01)
format = esp
critical = full
important = nano
useful = nano
drawings = no
pages = category
download = nano
dest = dist/esp-small
budget = 460
shrink = important:omit, useful:omit, download:none
